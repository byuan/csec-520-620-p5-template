name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (byte-compile)
        run: python -m py_compile src/*.py tests/*.py
      - name: Unit tests
        run: python -m pytest -q
      # The full run needs the UNSW-NB15 CSVs, which are not in the repo, so CI does a
      # dry run on synthetic data. Exit code 2 means "ran cleanly, TODOs remain": that
      # passes with a warning. Any other failure (a crash in your code) fails CI.
      - name: Synthetic dry run
        run: |
          set +e
          python -m src.p5 --config config.yaml --synthetic
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=P5 not finished::Some TODO functions in src/svm_tasks.py are not written yet."
            exit 0
          fi
          exit "$rc"
